apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: shopsphere-pool
  namespace: metallb-system
spec:
  addresses:
    - 10.191.0.240/32
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: shopsphere-advertisement
  namespace: metallb-system
spec:
  ipAddressPools:
    - shopsphere-pool