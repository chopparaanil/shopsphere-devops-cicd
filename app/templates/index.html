<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopSphere Book Store</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header class="header">
        <div class="container">
            <h1>ShopSphere Book Store</h1>
            <p>Manage your books in one place</p>
        </div>
    </header>

    <main class="container">
        <section class="card">
            <h2>Add a Book</h2>

            <form id="book-form">
                <div class="form-group">
                    <label for="book-name">Book Name</label>
                    <input
                        type="text"
                        id="book-name"
                        name="name"
                        placeholder="Enter book name"
                        maxlength="200"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="book-price">Price (₹)</label>
                    <input
                        type="number"
                        id="book-price"
                        name="price"
                        placeholder="Enter price"
                        min="0.01"
                        step="0.01"
                        required
                    >
                </div>

                <button type="submit">Add Book</button>
                <p id="message" role="status" aria-live="polite"></p>
            </form>
        </section>

        <section class="card">
            <h2>Available Books</h2>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Book Name</th>
                            <th>Price</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="books-table">
                        <tr>
                            <td colspan="4">Loading books...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <footer>
        <p>ShopSphere Book Store | Flask + PostgreSQL</p>
    </footer>

    <script src="{{ url_for('static', filename='js/app.js') }}" defer></script>
</body>
</html>
